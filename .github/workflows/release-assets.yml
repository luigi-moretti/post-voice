name: Release Assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to (re)build the zip for, e.g. v1.2.3'
        required: true

permissions:
  contents: write

jobs:
  build-zip:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npm run build

      - name: Resolve version from tag
        id: version
        run: |
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - run: scripts/build-plugin-zip.sh "${{ steps.version.outputs.version }}"

      - name: Upload zip to the release
        run: gh release upload "$TAG" "post-voice-${{ steps.version.outputs.version }}.zip" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
