name: CI

on:
  pull_request:
  push:
    branches: [ master ]

# A new push to the same PR/branch supersedes the previous one — cancel
# whatever of it is still running (e2e is almost always what's still going)
# instead of letting it burn free-tier Actions minutes for a run whose result
# nobody will read. This is exactly what happened manually
# (github.com/luigi-moretti/post-voice/actions/runs/32209990340): a push
# landed while the prior run's `playwright install` step was still stuck, and
# the old run kept billing until someone noticed and cancelled it by hand.
# `github.head_ref` is only set on `pull_request` events and is stable across
# every push to the same PR branch, which is what makes grouping by it useful
# — a new push cancels the old run in the same group. Falling back to
# `github.ref` instead of `github.run_id` here would be a real bug: `ref` is
# the same value (`refs/heads/master`) for every push to master, so two
# merges landing close together would cancel the first one's still-running
# "last safety net" full suite before it ever reported. `github.run_id` is
# unique per run, so the fallback group is unique per push and
# `cancel-in-progress` never actually cancels a master run.
concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npm run lint:js
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.2', tools: composer }
      - run: composer install
      - run: composer run lint
      - run: composer run stan

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npm run test:unit -- --coverage

      # pcov, not the default "none": PHPUnit 9 silently produces an empty
      # Clover report without a coverage driver, and the threshold check below
      # would then pass on 0 measured statements.
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.2', tools: composer, coverage: pcov }
      - run: composer install

      # The WordPress test suite needs a real WordPress checkout and a real
      # MySQL. wp-env provisions both, and unpacks core onto the runner's own
      # filesystem, so PHPUnit runs directly on the runner against them — the
      # same path scripts/run-php-tests.sh takes locally.
      - run: npx wp-env start
      - run: npm run test:php -- --coverage-clover=coverage/clover.xml
      - run: php scripts/check-coverage-threshold.php coverage/clover.xml 85
      - if: always()
        run: npx wp-env stop

  # Its own job rather than a step on `lint`: this one needs wp-env (WP-CLI does
  # the extraction) and a development build, and a stale .pot should read as a
  # translation problem, not as a lint failure.
  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npx wp-env start
      - run: npm run i18n:check
      - if: always()
        run: npx wp-env stop

  # Decides whether the e2e job's ~20-25 real-audio-generation minutes are
  # worth spending on this PR at all. Scoped to `pull_request` only — a push
  # to `master` (post-merge) always runs the full suite regardless, as the
  # last safety net before anything ships. Listed paths are everything e2e
  # actually exercises: the three features it covers, shared code they
  # depend on, the e2e suite itself (including its mu-plugins/fixtures), the
  # plugin bootstrap, the build/test config that produces what e2e runs
  # against, and this workflow file itself — so a change to the e2e job
  # (like this one) always validates itself rather than trusting its own
  # correctness un-run.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: filter
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
              | grep -qE '^(features/narration/|features/pronunciation/|features/player-style/|shared/|e2e/|post-voice\.php|package(-lock)?\.json$|composer\.(json|lock)$|webpack\.config\.js$|playwright\.config\.ts$|\.wp-env\.json$|\.github/workflows/)'; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "e2e=false" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    needs: [ changes ]
    if: always() && (github.event_name != 'pull_request' || needs.changes.outputs.e2e == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npm run build
      - run: npx wp-env start
      # Without this, `playwright install --with-deps` re-downloads the ~150MB
      # Chromium + headless-shell binaries from scratch on every run — the
      # step that stalled past 24 minutes and ate the free-tier Actions
      # budget (github.com/luigi-moretti/post-voice/actions/runs/32209990340).
      # Keyed on the resolved @playwright/test version so a dependency bump
      # naturally misses the cache instead of serving stale binaries.
      - name: Resolve installed Playwright version
        id: playwright-version
        run: |
          echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
      # The headless shell is named explicitly: the wp-scripts base Playwright
      # config asks for it, and it has not always come along with `chromium`.
      # System libraries (`--with-deps`) are never cached — apt installs them
      # into the runner's own filesystem, which is discarded with the VM at
      # the end of every job regardless of cache — so they're always
      # reinstalled; that apt step alone is fast (~1 min), not the bottleneck
      # this fixes.
      - name: Install Playwright browsers (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium chromium-headless-shell
      - name: Install Playwright system dependencies only (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium chromium-headless-shell
      - run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: artifacts/
          if-no-files-found: ignore
      - if: always()
        run: npx wp-env stop

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npm run audit:npm:production
      - run: npm run audit:npm
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.2', tools: composer }
      - run: composer install
      - run: npm run audit:composer
